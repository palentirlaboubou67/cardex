<script type="module">
// Banc d'essai : exécute les vrais modules js/scan/* (piloté par tools/scan_bench.py via window.bench).
import { ScanDB } from '../../js/scan/match.js';
import { identifyGuided, identifyUnguided, detectOnly, decide, T, DETECT, UNGUIDED } from '../../js/scan/identify.js';
import { canonFromRGBA, describe, warpRegion, POP16 } from '../../js/scan/describe.js';
import { compareRegions } from '../../js/scan/region.js';

const logEl = document.getElementById('log');
const log = s => { logEl.textContent += '\n' + s; };
let db = null, cards = null, local = new Set();

async function init() {
  const [buf, c] = await Promise.all([
    fetch('../../data/scan/hashes.bin', { cache: 'no-cache' }).then(r => r.arrayBuffer()),
    fetch('../../data/scan/cards.json', { cache: 'no-cache' }).then(r => r.json()),
  ]);
  cards = c;
  db = new ScanDB(buf, c);
  log(`base : ${db.n} cartes, ${db.groups.length} groupes, ${db.near.size} cartes avec sosies`);
  return { n: db.n, groups: db.groups.length };
}

async function decode(url) {
  let res = null;
  for (let k = 0; k < 3 && !res; k++) {
    try { res = await fetch(url); if (!res.ok) throw new Error(String(res.status)); } catch (e) { res = null; if (k === 2) throw e; await new Promise(r => setTimeout(r, 300)); }
  }
  const blob = await res.blob();
  const bmp = await createImageBitmap(blob, { premultiplyAlpha: 'none', colorSpaceConversion: 'none' });
  const cv = new OffscreenCanvas(bmp.width, bmp.height), x = cv.getContext('2d', { willReadFrequently: true });
  x.drawImage(bmp, 0, 0);
  const d = x.getImageData(0, 0, bmp.width, bmp.height);
  bmp.close();
  return d;
}

// Bits différents entre describe() (JS) et hashes.bin (Python) sur des images de référence
async function bitexact(list) {
  const out = [];
  for (const { id, url } of list) {
    const im = await decode(url);
    const q = describe(canonFromRGBA(im.data, im.width, im.height));
    const i = db.row.get(id), row = new Uint8Array(db.h.buffer, i * 64, 64);
    let dh = 0, ph = 0;
    for (let k = 0; k < 32; k++) { dh += POP16[q[k] ^ row[k]]; ph += POP16[q[32 + k] ^ row[32 + k]]; }
    out.push({ id, dh, ph });
  }
  return out;
}

// Les images haute définition locales remplacent TCGdex quand elles existent (banc hors ligne et rapide).
// lowLocal : images low.webp locales (banc des photos réelles : jamais de téléchargement d'images en masse) ;
// une carte sans high.webp locale est alors comparée à sa low.webp agrandie.
let lowLocal = new Set();
function setLocal(list, low = []) { local = new Set(list); lowLocal = new Set(low); }
function resolveUrl(url) {
  const m = url.match(/^https:\/\/assets\.tcgdex\.net\/(fr|en)\/[^/]+\/([^/]+)\/([^/]+)\/high\.webp$/);
  if (m) {
    const rel = `img_${m[1]}_high/${m[2]}/${m[3]}.webp`;
    if (local.has(rel)) return '/__img/' + rel;
    const low = `img_${m[1]}_low/${m[2]}/${m[3]}.webp`;
    if (lowLocal.size && lowLocal.has(low)) return '/__img/' + low;
  }
  return url;
}

// Identifie une liste de photos. c = { url, id, guide: [x, y, w, h] | null }
async function runCases(cases, { exclude = false, unguided = false, region = true, self = false } = {}) {
  const out = [];
  for (const c of cases) {
    const t0 = performance.now();
    let im;
    try { im = await decode(c.url); } catch (e) { out.push({ id: c.id, error: 'decode ' + String(e?.message || e) }); continue; }
    const tdec = performance.now() - t0;
    db.exclude(exclude ? [c.id] : null);
    let r;
    try {
      r = unguided || !c.guide ? identifyUnguided(db, im)
        : identifyGuided(db, im, { x: c.guide[0], y: c.guide[1], w: c.guide[2], h: c.guide[3] });
    } catch (e) {
      out.push({ id: c.id, error: String(e && e.stack || e) });
      continue;
    }
    const rec = { id: c.id, ms: r.ms, dec: tdec, nev: r.nev, stage: r.stage, quad: r.quad };
    if (r.rank) {
      const k = r.rank, dcs = decide(k);
      rec.top = k.top.map(x => [x.id, +x.d.toFixed(4)]);
      rec.d1 = k.d1; rec.d2 = k.d2; rec.level = dcs.level; rec.reprint = dcs.reprint;
      rec.group = k.group.map(x => db.ids[x.i]);
      rec.rivals = dcs.rivals.map(i => db.ids[i]);
      rec.twins = db.twinsOf(k.i1);
      rec.arts = (db.arts.get(k.i1) || []).map(j => db.ids[j]);
      if (region && (dcs.reprint || dcs.rivals.length) && dcs.level !== 'none') {
        const rows = [...new Set([...k.group.map(x => x.i), ...dcs.rivals, k.i1])];
        const t1 = performance.now();
        const sc = await compareRegions(db, im, r.quad, rows, { urlOf: i => resolveUrl(db.imageBase(i) + '/high.webp') });
        rec.regionMs = performance.now() - t1;
        rec.regions = sc ? sc.map(x => [db.ids[x.i], x.score == null ? null : +x.score.toFixed(4)]) : null;
      }
      // corrélation de la zone du numéro avec la seule carte n° 1 (mesure : ne sépare pas assez, non appliquée)
      if (self && (dcs.level === 'strong' || dcs.level === 'normal')) {
        const sc = await compareRegions(db, im, r.quad, [k.i1], { urlOf: i => resolveUrl(db.imageBase(i) + '/high.webp') });
        rec.self = sc && sc[0].score != null ? +sc[0].score.toFixed(4) : null;
      }
    }
    out.push(rec);
  }
  db.exclude(null);
  return out;
}

// Détection rapide de la boucle (loop.js detect) : zone du guide + marge 0,3, réduite à 420 px de guide par
// createImageBitmap (qualité 'medium'), puis detectOnly. La boucle n'identifie que si quad && found ≥ 3.
async function detectCases(cases) {
  const out = [];
  for (const c of cases) {
    const blob = await (await fetch(c.url)).blob();
    const bmp = await createImageBitmap(blob);
    const g = c.guide, m = 0.3 * g[3];
    const X0 = Math.max(0, Math.floor(g[0] - m)), Y0 = Math.max(0, Math.floor(g[1] - m));
    const X1 = Math.min(bmp.width, Math.ceil(g[0] + g[2] + m)), Y1 = Math.min(bmp.height, Math.ceil(g[1] + g[3] + m));
    const k = 420 / g[3], rw = Math.max(8, Math.round((X1 - X0) * k)), rh = Math.max(8, Math.round((Y1 - Y0) * k));
    const sm = await createImageBitmap(bmp, X0, Y0, X1 - X0, Y1 - Y0, { resizeWidth: rw, resizeHeight: rh, resizeQuality: 'medium' });
    const cv = new OffscreenCanvas(rw, rh), x = cv.getContext('2d', { willReadFrequently: true });
    x.drawImage(sm, 0, 0);
    const kx = rw / (X1 - X0), ky = rh / (Y1 - Y0);
    const d = detectOnly(x.getImageData(0, 0, rw, rh), { x: (g[0] - X0) * kx, y: (g[1] - Y0) * ky, w: g[2] * kx, h: g[3] * ky });
    out.push({ id: c.id, found: d.found, quad: !!d.quad, far: d.far, sharp: d.sharp, nsharp: d.nsharp, present: !!d.quad && d.found >= 3 });
    bmp.close(); sm.close();
  }
  return out;
}

// ---------------------------------------------------------------------------------------------------------
// OCR : lignes préparées comme dans le worker, lues par tesseract (vendor/tesseract), grammaire et vérification
let O = null, P = null;
async function ocrInit() {
  O = await import('../../js/scan/ocr.js');
  P = await import('../../js/scan/ocrprep.js');
  O.setCards(cards);
  const t0 = performance.now();
  await O.load();
  return { loadMs: performance.now() - t0 };
}

// c = { url, id, guide, corners? } ; quad : détecté (identifyGuided) ou vrais coins (c.corners) si demandé
async function ocrCases(cases, { trueQuad = false } = {}) {
  const out = [];
  for (const c of cases) {
    const im = await decode(c.url);
    let quad = c.corners || null, top = [];
    const dists = {};
    if (!trueQuad && c.guide) {
      const r = identifyGuided(db, im, { x: c.guide[0], y: c.guide[1], w: c.guide[2], h: c.guide[3] });
      if (r.quad) quad = r.quad;
      if (r.rank) {
        top = [...r.rank.top.map(x => x.id), ...r.rank.group.map(x => db.ids[x.i])];
        for (const x of r.rank.group) dists[db.ids[x.i]] = x.d;
        for (const x of r.rank.top) dists[x.id] = x.d;
      }
    }
    if (!quad) { out.push({ id: c.id, error: 'pas de quad' }); continue; }
    const nums = O.numsFor([c.id]);
    const lines = P.ocrLines(im, quad, nums);
    const texts = [], ms = [];
    for (const l of lines) {
      const t0 = performance.now();
      const { text, conf } = await O.readLine(l.img);
      ms.push(performance.now() - t0);
      texts.push({ v: l.variant, num: l.num, box: !!l.box, text, conf });
    }
    const tx = texts.map(t => ({ text: t.text, num: t.num, box: t.box, variant: t.v }));
    const free = O.decideOcr(tx, []);
    // candidats dans l'ordre de l'image (la vraie carte ajoutée en fin si l'image ne l'a pas proposée)
    const cands = [...new Set([...top, c.id])];
    const ver = O.decideOcr(tx, cands, dists);
    out.push({ id: c.id, exp: O.expected(c.id), texts, ms, free, ver, cands: cands.length });
  }
  return out;
}

// lignes déjà rendues (texte synthétique) : c = { url, id }
async function ocrRaw(cases) {
  const out = [];
  for (const c of cases) {
    const im = await decode(c.url);
    const g = new Float32Array(im.width * im.height);
    for (let i = 0, p = 0; i < g.length; i++, p += 4) g[i] = 0.299 * im.data[p] + 0.587 * im.data[p + 1] + 0.114 * im.data[p + 2];
    const vars = P.prepLine(g, im.width, im.height, { invertBox: false });
    const texts = [];
    for (const v of vars) texts.push((await O.readLine(v.img)).text);
    out.push({ id: c.id, exp: O.expected(c.id), texts, free: O.decideOcr(texts, []) });
  }
  return out;
}

// images des lignes préparées (PNG en data URL), pour les regarder
async function ocrDebug(c, { trueQuad = false } = {}) {
  const im = await decode(c.url);
  let quad = c.corners;
  if (!trueQuad && c.guide) {
    const r = identifyGuided(db, im, { x: c.guide[0], y: c.guide[1], w: c.guide[2], h: c.guide[3] });
    if (r.quad) quad = r.quad;
  }
  const lines = P.ocrLines(im, quad, O.numsFor([c.id]));
  const out = [];
  for (const l of lines) {
    const cv = new OffscreenCanvas(l.img.width, l.img.height);
    cv.getContext('2d').putImageData(l.img, 0, 0);
    const b = await cv.convertToBlob({ type: 'image/png' });
    out.push({ num: l.num, v: l.variant, png: await new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); }) });
  }
  return out;
}

// zone du numéro : scores avec le quad détecté et avec les vrais coins (c.corners), pour une liste d'ids
async function regionDebug(c, ids) {
  const im = await decode(c.url);
  const r = identifyGuided(db, im, { x: c.guide[0], y: c.guide[1], w: c.guide[2], h: c.guide[3] });
  const rows = ids.map(id => db.row.get(id));
  const urlOf = i => resolveUrl(db.imageBase(i) + '/high.webp');
  const det = await compareRegions(db, im, r.quad, rows, { urlOf });
  const tru = c.corners ? await compareRegions(db, im, c.corners, rows, { urlOf }) : null;
  const fmt = s => s && s.map(x => [db.ids[x.i], x.score == null ? null : +x.score.toFixed(3)]);
  return { quad: r.quad, corners: c.corners, det: fmt(det), tru: fmt(tru), urls: rows.map(urlOf) };
}

// Oracle (photos réelles) : descripteur pris sur le vrai quad de la carte (vérité terrain SIFT), sans détecteur.
// c = { url, id, quad } → rang de la vraie carte (réimpressions comprises), distances. Mesure le plafond de la
// correspondance par empreintes, indépendamment de la détection des bords.
async function oracleCases(cases) {
  const out = [];
  for (const c of cases) {
    const im = await decode(c.url);
    const g = new Float32Array(im.width * im.height);
    for (let i = 0, p = 0; i < g.length; i++, p += 4) g[i] = 0.299 * im.data[p] + 0.587 * im.data[p + 1] + 0.114 * im.data[p + 2];
    const cw = warpRegion(g, im.width, im.height, c.quad);
    if (!cw) { out.push({ id: c.id, error: 'quad' }); continue; }
    const d = describe(cw), k = db.rank(d, 5), dc = decide(k);
    const i = db.row.get(c.id);
    const dt = i === undefined ? null : db.bits(d, i) / 128;
    let better = 0;
    if (dt != null) {
      const mem = new Set(db.members(i));
      for (let j = 0; j < db.n; j++) if (!mem.has(j) && db.bits(d, j) / 128 < dt) better++;
    }
    out.push({ id: c.id, top: k.top.map(x => [x.id, +x.d.toFixed(4)]), d1: k.d1, d2: k.d2, dTrue: dt, better, level: dc.level,
      group: k.group.map(x => db.ids[x.i]), rivals: dc.rivals.map(j => db.ids[j]) });
  }
  return out;
}

// Détecteur guidé pas à pas : droites candidates de chaque côté (extrémités en pixels de l'image), quad de chaque
// étape et distance du quad vrai (c.quad) sous l'objectif de la base. Pour regarder les échecs.
async function debugGuided(c) {
  const D = await import('../../js/scan/detect.js');
  const I = await import('../../js/scan/identify.js');
  const im = await decode(c.url);
  const W = im.width, H = im.height, g = { x: c.guide[0], y: c.guide[1], w: c.guide[2], h: c.guide[3] };
  const m = 0.3 * g.h;
  const roi = [Math.max(0, Math.floor(g.x - m)), Math.max(0, Math.floor(g.y - m)), Math.min(W, Math.ceil(g.x + g.w + m)), Math.min(H, Math.ceil(g.y + g.h + m))];
  const img = D.smallImage(im.data, W, H, D.GUIDE_H / g.h, roi);
  const wk = I.workGray(im.data, W, H, roi, g.h >= 900 ? 2 : 1);
  const obj = q => {
    const qq = q.map(p => D.fromSmall(img, p));
    const cw = warpRegion(wk.g, wk.w, wk.h, qq.map(([x, y]) => [(x - wk.x0) / wk.f, (y - wk.y0) / wk.f]));
    return cw ? db.best(describe(cw)).s / 128 : Infinity;
  };
  const g0 = D.rectQuad(...D.toSmall(img, [g.x, g.y]), g.w * img.kx, g.h * img.ky);
  const lines = so => so.sides.map(s => s.opts.map((o, i) => ({
    a: D.fromSmall(img, [o.p[0] - o.v[0] * 300, o.p[1] - o.v[1] * 300]), b: D.fromSmall(img, [o.p[0] + o.v[0] * 300, o.p[1] + o.v[1] * 300]),
    d: +o.d.toFixed(1), v: +(s.info[i]?.v || 0).toFixed(0), cov: +(s.info[i]?.cov || 0).toFixed(2) })));
  const so = D.sideOptions(img, g0), so2 = D.sideOptions(img, g0, { extra: true });
  const r1 = D.search(so, obj), r2 = D.search(so2, obj);
  const trueD = c.quad ? (() => {
    const cw = warpRegion(wk.g, wk.w, wk.h, c.quad.map(([x, y]) => [(x - wk.x0) / wk.f, (y - wk.y0) / wk.f]));
    return cw ? db.best(describe(cw)).s / 128 : null;
  })() : null;
  const full = I.identifyGuided(db, im, g);
  // meilleure combinaison possible : pour chaque côté, l'option la plus proche du vrai côté (écart des extrémités)
  const near = so_ => {
    if (!c.quad) return null;
    const tq = c.quad.map(p => D.toSmall(img, p));
    const ch = so_.sides.map((s, k) => {
      const a = tq[k], b = tq[(k + 1) % 4];
      let bi = 0, be = Infinity;
      s.opts.forEach((o, i) => {
        const dist = p => Math.abs((p[0] - o.p[0]) * o.v[1] - (p[1] - o.p[1]) * o.v[0]);
        const e = Math.max(dist(a), dist(b));
        if (e < be) { be = e; bi = i; }
      });
      return [bi, +(be / so_.h).toFixed(3)];
    });
    const q = D.quadFrom(ch.map(([i], k) => so_.sides[k].opts[i]), { tol: 0.2 });
    return { ch, s: q ? obj(q) : null };
  };
  const seeds = D.seedCombos(so, { k: 6 });
  return { opts: lines(so), opts2: lines(so2), best1: near(so), best2: near(so2), seeds, r1: { q: r1.quad && r1.quad.map(p => D.fromSmall(img, p)), s: r1.score, ch: r1.choice },
    r2: { q: r2.quad && r2.quad.map(p => D.fromSmall(img, p)), s: r2.score }, trueD, final: { q: full.quad, stage: full.stage, d1: full.rank?.d1 } };
}

// Rang, parmi les départs géométriques (seedCombos), de la combinaison de pics la plus proche du vrai quad
// (options normales puis « extra ») : c = { url, guide, quad }. Sans évaluation de la base sauf pour cette combinaison.
async function seedStats(cases, { k = 200, extra = false } = {}) {
  const D = await import('../../js/scan/detect.js');
  const I = await import('../../js/scan/identify.js');
  const out = [];
  for (const c of cases) {
    let im;
    try { im = await decode(c.url); } catch { out.push({ error: 1 }); continue; }
    const W = im.width, H = im.height, g = { x: c.guide[0], y: c.guide[1], w: c.guide[2], h: c.guide[3] };
    const m = 0.3 * g.h;
    const roi = [Math.max(0, Math.floor(g.x - m)), Math.max(0, Math.floor(g.y - m)), Math.min(W, Math.ceil(g.x + g.w + m)), Math.min(H, Math.ceil(g.y + g.h + m))];
    const img = D.smallImage(im.data, W, H, D.GUIDE_H / g.h, roi);
    const g0 = D.rectQuad(...D.toSmall(img, [g.x, g.y]), g.w * img.kx, g.h * img.ky);
    const so = D.sideOptions(img, g0, { extra });
    const tq = c.quad.map(p => D.toSmall(img, p));
    // côté par côté : option la plus proche, et son pic (info)
    const near = so.sides.map((s, kk) => {
      const a = tq[kk], b = tq[(kk + 1) % 4];
      let bi = 0, be = Infinity;
      s.opts.forEach((o, i) => {
        const dist = p => Math.abs((p[0] - o.p[0]) * o.v[1] - (p[1] - o.p[1]) * o.v[0]);
        const e = Math.max(dist(a), dist(b));
        if (e < be) { be = e; bi = i; }
      });
      return { i: bi, e: be / so.h, inf: s.info[bi] };
    });
    const seeds = D.seedCombos(so, { k, maxPeaks: extra ? 8 : 6 });
    const rank = seeds.findIndex(ch => ch.every((x, kk) => so.sides[kk].info[x] === near[kk].inf));
    // caractéristiques des pics (pour régler le score géométrique) : par côté, [v, cov, d/h, th, str, nsh, i option]
    const feats = so.sides.map(s => {
      const uniq = [], seen = new Set();
      s.info.forEach((inf, i) => { if (inf && !seen.has(inf)) { seen.add(inf); uniq.push([inf.v || 0, inf.cov || 0, s.opts[i].d / so.h, inf.th || 0, inf.str || 0, inf.nsh || 0, i]); } });
      return uniq;
    });
    out.push({ rank, err: Math.max(...near.map(x => x.e)), peaks: near.map((x, kk) => [...new Set(so.sides[kk].info)].indexOf(x.inf)), n: seeds.length, feats,
      lines: so.sides.map(s => s.opts.map(o => [o.p[0], o.p[1], o.v[0], o.v[1]])), h: so.h });
  }
  return out;
}

// Propositions du détecteur sans guide (photo importée) : quads (pixels de l'image), dans l'ordre, avec la distance
// rapide (meilleure des deux rotations) ; pour savoir si la vraie carte est proposée et à quel rang.
async function proposalStats(cases, { max = 8 } = {}) {
  const D = await import('../../js/scan/detect.js');
  const I = await import('../../js/scan/identify.js');
  const out = [];
  for (const c of cases) {
    let im;
    try { im = await decode(c.url); } catch { out.push({ error: 1 }); continue; }
    const W = im.width, H = im.height, k0 = Math.min(1, 640 / Math.max(W, H));
    const over = D.smallImage(im.data, W, H, k0);
    const t0 = performance.now();
    const props = D.proposals(over, { max }).map(q => q.map(p => D.fromSmall(over, p)));
    const tp = performance.now() - t0;
    const fw = Math.max(1, Math.floor(Math.max(W, H) / 2000));
    const wk = I.workGray(im.data, W, H, [0, 0, W, H], fw);
    const sc = props.map(q => Math.min(...D.rotations(q).map(r => {
      const cw = warpRegion(wk.g, wk.w, wk.h, r.map(([x, y]) => [x / fw, y / fw]));
      return cw ? db.best(describe(cw)).s / 128 : 9;
    })));
    out.push({ props, sc, tp });
  }
  return out;
}

// Coût d'une évaluation de l'objectif du détecteur : redressement, descripteur, recherche dans la base (ms)
async function profile(n = 60) {
  const W = 1200, H = 1700, g = new Float32Array(W * H);
  for (let i = 0; i < g.length; i++) g[i] = (Math.imul(i, 2654435761) >>> 24);
  const q = [[100, 100], [1100, 120], [1080, 1600], [90, 1580]];
  let t0 = performance.now(), c, d;
  for (let i = 0; i < n; i++) c = warpRegion(g, W, H, q);
  const warp = (performance.now() - t0) / n;
  t0 = performance.now();
  for (let i = 0; i < n; i++) d = describe(c);
  const desc = (performance.now() - t0) / n;
  t0 = performance.now();
  for (let i = 0; i < n; i++) db.best(d);
  const search = (performance.now() - t0) / n;
  return { warp, desc, search };
}

const setDetect = o => { const { unguided, ...d } = o; Object.assign(DETECT, d); if (unguided) Object.assign(UNGUIDED, unguided); };
