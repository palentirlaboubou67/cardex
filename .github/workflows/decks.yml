# Met à jour data/decks.json (méta Limitless + prix TCGdex) chaque lundi, ou à la demande.
name: Mise à jour des decks
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_decks.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/decks.json
          git diff --cached --quiet || (git commit -m "Decks : mise à jour automatique" && git push)
